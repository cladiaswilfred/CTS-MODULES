<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 12.2</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
    <h2 class="text-center mb-5 fw-light">Plans</h2>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card border-0 shadow text-center h-100">
                <div class="card-body p-5">
                    <h3 class="fw-bold">Free</h3>
                    <p class="display-6 fw-bold text-info">$0</p>
                    <p class="text-secondary">1 project</p>
                    <p class="text-secondary">100MB storage</p>
                    <button class="btn btn-outline-info rounded-pill w-100 mt-3">Start</button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-primary border-2 shadow text-center h-100">
                <div class="card-body p-5">
                    <h3 class="fw-bold">Pro</h3>
                    <p class="display-6 fw-bold text-primary">$12</p>
                    <p class="text-secondary">10 projects</p>
                    <p class="text-secondary">5GB storage</p>
                    <button class="btn btn-primary rounded-pill w-100 mt-3">Subscribe</button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow text-center h-100">
                <div class="card-body p-5">
                    <h3 class="fw-bold">Enterprise</h3>
                    <p class="display-6 fw-bold text-dark">$39</p>
                    <p class="text-secondary">Unlimited</p>
                    <p class="text-secondary">50GB storage</p>
                    <button class="btn btn-dark rounded-pill w-100 mt-3">Contact</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
