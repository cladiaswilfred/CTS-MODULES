<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 13.1</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-5 fw-bold">Stats Dashboard</h2>
    <div class="row g-4">
        <div class="col-6 col-md-3">
            <div class="bg-dark text-white text-center p-5 rounded-4 shadow-sm">
                <h3 class="fw-bold">2.4k</h3>
                <p class="mb-0 text-secondary">Users</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="bg-success text-white text-center p-5 rounded-4 shadow-sm">
                <h3 class="fw-bold">$14k</h3>
                <p class="mb-0 text-white-50">Revenue</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="bg-warning text-dark text-center p-5 rounded-4 shadow-sm">
                <h3 class="fw-bold">89</h3>
                <p class="mb-0">Orders</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="bg-info text-white text-center p-5 rounded-4 shadow-sm">
                <h3 class="fw-bold">12</h3>
                <p class="mb-0">Pending</p>
            </div>
        </div>
