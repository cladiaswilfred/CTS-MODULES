<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 18.2</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
    <h2 class="text-center mb-5 fw-light">FAQ Accordion</h2>
    <div class="accordion" id="helpAccordion">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button bg-primary text-white" type="button" data-bs-toggle="collapse" data-bs-target="#q1">What is this?</button>
            </h2>
            <div id="q1" class="accordion-collapse collapse show" data-bs-parent="#helpAccordion">
                <div class="accordion-body">This is a Bootstrap accordion component built with collapse.</div>
            </div>
        </div>
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed bg-success text-white" type="button" data-bs-toggle="collapse" data-bs-target="#q2">How much does it cost?</button>
            </h2>
            <div id="q2" class="accordion-collapse collapse" data-bs-parent="#helpAccordion">
                <div class="accordion-body">It is completely free to use.</div>
            </div>
        </div>
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed bg-info text-white" type="button" data-bs-toggle="collapse" data-bs-target="#q3">Can I contribute?</button>
            </h2>
            <div id="q3" class="accordion-collapse collapse" data-bs-parent="#helpAccordion">
                <div class="accordion-body">Yes, contributions are welcome on GitHub.</div>
            </div>
        </div>
    </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
