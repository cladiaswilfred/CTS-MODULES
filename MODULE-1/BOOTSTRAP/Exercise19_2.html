<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 19.2</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
<div class="container py-5 text-center">
    <h2 class="mb-5 fw-bold">Toast Notification</h2>
    <button class="btn btn-danger btn-lg" id="fireToast">Show Toast</button>
</div>
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
    <div id="myToast" class="toast align-items-center text-white bg-danger border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body">This is a toast notification from Bootstrap.</div>
            <button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('fireToast').addEventListener('click', function(){
    var t = new bootstrap.Toast(document.getElementById('myToast'))
    t.show()
})
</script>
</body>
</html>
