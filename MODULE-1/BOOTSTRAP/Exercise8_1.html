<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8.1</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h2 class="text-center mb-5 fw-bold">Register</h2>
            <form>
                <div class="mb-3">
                    <label class="form-label fw-medium">Name</label>
                    <input type="text" class="form-control form-control-lg" placeholder="Enter name">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Email</label>
                    <input type="email" class="form-control form-control-lg" placeholder="Enter email">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Bio</label>
                    <textarea class="form-control" rows="3" placeholder="About you"></textarea>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="agree">
                    <label class="form-check-label" for="agree">I agree to terms</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill">Submit</button>
            </form>
        </div>
    </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
