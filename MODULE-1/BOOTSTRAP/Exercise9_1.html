<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9.1</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
    <h2 class="text-center mb-5 fw-light">Buttons Collection</h2>
    <div class="d-flex flex-wrap gap-2 mb-4">
        <button class="btn btn-primary rounded-pill">Primary</button>
        <button class="btn btn-secondary rounded-pill">Secondary</button>
        <button class="btn btn-success rounded-pill">Success</button>
        <button class="btn btn-danger rounded-pill">Danger</button>
        <button class="btn btn-warning rounded-pill">Warning</button>
        <button class="btn btn-info rounded-pill">Info</button>
        <button class="btn btn-dark rounded-pill">Dark</button>
        <button class="btn btn-light border rounded-pill">Light</button>
    </div>
    <hr>
    <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary rounded-0">Outlined</button>
        <button class="btn btn-outline-secondary rounded-0">Outlined</button>
        <button class="btn btn-outline-success rounded-0">Outlined</button>
        <button class="btn btn-outline-danger rounded-0">Outlined</button>
        <button class="btn btn-outline-warning rounded-0">Outlined</button>
        <button class="btn btn-outline-info rounded-0">Outlined</button>
        <button class="btn btn-outline-dark rounded-0">Outlined</button>
    </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
