<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9.2</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
    <h2 class="text-center mb-5 fw-bold">Groups & Toggles</h2>
    <div class="d-flex flex-wrap gap-4 mb-5">
        <div class="btn-group" role="group">
            <button class="btn btn-secondary">Left</button>
            <button class="btn btn-secondary">Middle</button>
            <button class="btn btn-secondary">Right</button>
        </div>
        <div class="btn-group" role="group">
            <button class="btn btn-outline-danger">1</button>
            <button class="btn btn-outline-danger">2</button>
            <button class="btn btn-outline-danger">3</button>
        </div>
    </div>
    <div class="d-flex flex-wrap gap-3">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="s1">
            <label class="form-check-label" for="s1">Notifications</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="s2" checked>
            <label class="form-check-label" for="s2">Dark Mode</label>
        </div>
    </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
