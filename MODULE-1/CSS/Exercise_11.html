<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Debugging Lab</title>
    <style>
        .box{
            width: 320px;
            height: 200px;
            background: radial-gradient(circle, #3498db, #1a5276);
            margin: 30px auto;
            border-radius: 20px 0 20px 0;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.15), 0 6px 18px rgba(0,0,0,0.3);
        }
        body{
            font-family: 'Consolas', monospace;
            background: #1c2833;
            color: #d5dbdb;
            text-align: center;
            padding: 20px;
        }
        h1{
            color: #f4d03f;
        }
        p{
            max-width: 500px;
            margin: 20px auto;
            line-height: 1.7;
        }
    </style>
</head>
<body>
<h1>Debugging Practice</h1>
<div class="box"></div>
<p>
    Open Chrome DevTools to inspect styles, test responsive layouts, and verify CSS rules.
</p>
</body>
</html>
