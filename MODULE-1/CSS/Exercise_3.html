<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selector Types Practice</title>
    <style>
        *{
            box-sizing: border-box;
        }
        h2{
            color: #d35400;
            font-size: 1.6rem;
        }
        #mainHeader{
            background: linear-gradient(90deg, #2c3e50, #4ca1af);
            color: #fdfefe;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .eventCard{
            background-color: #fafafa;
            border: 2px solid #bdc3c7;
            border-radius: 12px;
            padding: 18px;
            margin: 15px 10px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.08);
        }
        h3, p{
            font-family: Georgia, serif;
        }
        .eventCard p{
            color: #566573;
        }
    </style>
</head>
<body>
    <div id="mainHeader">
        <h1>Summer Training Sessions</h1>
    </div>
    <h2>Featured Workshops</h2>
    <div class="eventCard">
        <h3>Music Production</h3>
        <p>Hands-on session covering DAW basics and sound mixing.</p>
    </div>
    <div class="eventCard">
        <h3>Digital Marketing</h3>
        <p>Learn SEO, social media strategy, and analytics tools.</p>
    </div>
</body>
</html>
