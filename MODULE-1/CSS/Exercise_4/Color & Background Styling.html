<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color and Background Effects</title>
    <style>
        body{
            background-color: #1b2631;
            background-image: url("https://picsum.photos/seed/pattern/1600/900");
            background-size: cover;
            background-blend-mode: overlay;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1{
            background: radial-gradient(circle at 30% 40%, #f7971e, #ffd200);
            color: #1a1a2e;
            padding: 30px 50px;
            text-align: center;
            border-radius: 50px;
            font-size: 2.8rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-shadow: 2px 2px 0 rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <h1>National Youth Festival</h1>
</body>
</html>
