<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Font and Text Styling</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+Pro&display=swap" rel="stylesheet">
    <style>
        body{
            font-family: 'Source Sans Pro', Arial, sans-serif;
            background: #f8f9fa;
            margin: 40px 60px;
        }
        h1{
            font-family: 'Merriweather', Georgia, serif;
            font-size: 42px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #1b4f72;
        }
        p{
            letter-spacing: normal;
            line-height: 1.9;
            text-align: justify;
            font-size: 1.1rem;
            color: #2c3e50;
            word-spacing: 2px;
        }
    </style>
</head>
<body>
    <h1>Weekly Digest</h1>
    <p>
        Your weekly roundup of everything happening on campus includes guest lectures, sports meets, and club recruitment drives. Make sure to check the notice board every Monday morning for freshly posted opportunities and deadline reminders.
    </p>
</body>
</html>
