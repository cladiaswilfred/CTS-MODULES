<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link and List Styling</title>
    <style>
        a:link{
            color: #c0392b;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover{
            color: #f39c12;
            background-color: #fef9e7;
            padding: 2px 6px;
        }
        a:active{
            color: #16a085;
        }
        a:visited{
            color: #7d3c98;
        }
        ul{
            list-style-type: circle;
            list-style-position: inside;
            padding: 12px;
            background: #eaf2f8;
            border-radius: 8px;
        }
        li{
            padding: 10px 15px;
            margin: 5px 0;
            background-color: #d5e8d4;
            border-left: 4px solid #27ae60;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <a href="#">Student Dashboard</a>
    <ul>
        <li>Photography Exhibition</li>
        <li>Debate Championship</li>
        <li>Robotics Workshop</li>
    </ul>
</body>
</html>
