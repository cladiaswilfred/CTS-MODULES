<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Debug Console</title>
 <style>
  h1 {
   color: teal;
  }
 </style>
 <script>
  function runTest() {
   let a = 40;
   let b = 60;
   console.log("Value A:", a);
   console.log("Value B:", b);
   let sum = a + b;
   console.log("Sum is:", sum);
   alert("Look at the console for output");
  }
 </script>
</head>
<body>
<center>
<h1>Console Testing</h1>
<button onclick="runTest()">
  Run Script
</button>
</center>
</body>
</html>
