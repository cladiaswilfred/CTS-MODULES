<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fetch API Example</title>
</head>
<body>
<button id="sendBtn">
    Send Feedback
</button>
<p id="status"></p>
<script>
    document.getElementById("sendBtn")
    .addEventListener("click", function(){
        document.getElementById("status")
        .innerHTML = "Sending...";
        setTimeout(function(){
            fetch("https://jsonplaceholder.typicode.com/posts",{
                method:"POST",
                body: JSON.stringify({
                    user:"Ananya"
                }),
                headers:{
                    "Content-type":"application/json"
                }
            })
            .then(res => res.json())
            .then(info => {
                document.getElementById("status")
                .innerHTML = "Feedback Received";
                console.log(info);
            });
        },2000);
    });
</script>
</body>
</html>
