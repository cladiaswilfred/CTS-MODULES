<!DOCTYPE html>
<html lang="en">
<head>
    <title>JS Libraries Overview</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<button id="switchBtn">
    Switch Box
</button>
<div id="box">
    Framework Details
</div>
<script>
    $("#switchBtn").click(function(){
        $("#box").fadeOut();
    });
</script>
</body>
</html>
