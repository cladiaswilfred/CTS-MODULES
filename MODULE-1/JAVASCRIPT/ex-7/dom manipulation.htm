<!DOCTYPE html>
<html lang="en">
<head>
    <title>DOM Manipulation</title>
</head>
<body>
<div id="target"></div>
<button onclick="addBlock()">Add Item</button>
<script>
    function addBlock(){
        let area =
            document.querySelector("#target");
        let block =
            document.createElement("div");
        block.innerHTML = "Item Created";
        area.appendChild(block);
    }
</script>
</body>
</html>
