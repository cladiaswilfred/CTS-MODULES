<!DOCTYPE html>
<html>
<head>
    <title>Functions in JS</title>
</head>
<body>
<div id="display"></div>
<script>
const bookClass = (className) => className + " Booked";
const registerTrainee = (name) => name + " Registered";
document.getElementById("display").innerHTML =
bookClass("Zumba") + "<br>" +
registerTrainee("Ravi");
</script>
</body>
</html>
