<!DOCTYPE html>
<html lang="en">
<head>
    <title>jQuery Demo</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<button id="btn">
    Toggle Panel
</button>
<div id="panel">
    Workshop Information
</div>
<script>
    $("#btn").click(function(){
        $("#panel").fadeOut();
    });
</script>
</body>
</html>
